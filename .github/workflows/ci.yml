name: Dridha Crafts CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feat/**"
      - "feature/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Security & Hygiene Scan ──────────────────────────────────────
  security-audit:
    name: Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify no private secrets or .env files are committed
        run: |
          echo "Scanning Git tracked files for sensitive environment files..."
          FORBIDDEN_FILES=(
            ".env"
            "backend/.env"
            "frontend/.env"
            "frontend/.env.local"
            "create_admin.py"
          )
          FOUND=0
          for file in "${FORBIDDEN_FILES[@]}"; do
            if git ls-files --error-unmatch "$file" > /dev/null 2>&1; then
              echo "::error file=$file::Sensitive file '$file' is tracked in Git! Untrack and gitignore it immediately."
              FOUND=1
            fi
          done
          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "Security scan passed: No forbidden credentials or local .env files tracked in Git."

  # ── 2. Backend Syntax, Bytecode & Import Validation ──────────────────
  backend-check:
    name: Backend Lint & Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python bytecode compilation
        run: |
          python -m compileall app

      - name: Verify FastAPI application boot and schema integrity
        env:
          DATABASE_URL: "postgresql+asyncpg://mock:mock@localhost:5432/mock"
          JWT_SECRET: "dummy-mock-jwt-secret-key-at-least-32-chars-long"
          SUPABASE_URL: "https://mock-project.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-mock-service-role-key"
          ENVIRONMENT: "development"
          PORT: 8000
          CORS_ORIGINS: '["http://localhost:3000"]'
        run: |
          python -c "import app.main; print('FastAPI routes, models, and schemas initialized successfully!')"

  # ── 3. Frontend TypeScript & Production Build Verification ───────────
  frontend-check:
    name: Frontend TypeScript & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install dependencies
        run: npm install --prefer-offline --no-audit

      - name: Verify TypeScript types
        run: npx tsc --noEmit

      - name: Verify Next.js Production Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://mock-ci-project.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "mock-ci-anon-key-for-build-validation"
          NEXT_PUBLIC_CASHFREE_MODE: "sandbox"
        run: npm run build
